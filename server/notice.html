<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vibration results</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #021b29;
      --card: #043349;
      --card-edge: #14506c;
      --text: #f2f0ea;
      --muted-text: #9db6c3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 380px;
      padding: 28px 24px;
      display: grid;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--card-edge);
      border-radius: 12px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: var(--muted-text);
    }
  </style>
</head>
<body>
  <main>
    <h1>Vibration results</h1>
    <p>{{MSG}}</p>
  </main>
</body>
</html>
